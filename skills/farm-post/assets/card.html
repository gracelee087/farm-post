<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Post listing</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 12px; background: #faf7f0; color: #222; font-size: 18px; line-height: 1.45; }
      article { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      h2 { font-size: 22px; margin: 0 0 6px; }
      .price { font-size: 22px; font-weight: bold; color: #2d6a1f; margin: 0 0 8px; }
      .tags { color: #666; }
      .status { font-size: 15px; color: #555; }
      button { width: 100%; font-size: 20px; padding: 14px; margin-top: 10px; border: 0; border-radius: 10px; background: #2d6a1f; color: #fff; }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      let records = [];
      try { records = JSON.parse(localStorage.getItem("farm-post-outbox") || "[]"); } catch (e) {}
      if (id) records = records.filter((r) => r.id === id);
      records.reverse(); // newest first

      const tagText = (p) => (p.tags || []).map((t) => "#" + t.replace(/^#/, "").replace(/\s+/g, "")).join(" ");
      const priceText = (p) => [p.price_text, p.unit_price_text].filter(Boolean).join(" · ");
      const plain = (p) => [p.title + (priceText(p) ? "\n" + priceText(p) : ""), p.body, tagText(p)].filter(Boolean).join("\n\n");

      const list = document.getElementById("list");
      if (!records.length) list.textContent = "No listings yet. Send a photo of what you want to sell.";
      for (const r of records) {
        const p = r.post, el = document.createElement("article");
        const add = (tag, cls, text) => { if (!text) return; const n = document.createElement(tag); if (cls) n.className = cls; n.textContent = text; el.appendChild(n); };
        add("h2", "", p.title);
        add("p", "price", priceText(p));
        add("p", "", p.body);
        add("p", "tags", tagText(p));
        add("p", "status", r.status === "published" ? "✅ Posted" : "⏳ Waiting to be posted");
        const btn = document.createElement("button");
        btn.textContent = "Copy text";
        btn.onclick = async () => {
          try { await navigator.clipboard.writeText(plain(p)); btn.textContent = "Copied ✓"; }
          catch (e) { btn.textContent = "Copy failed – press and hold the text"; }
        };
        el.appendChild(btn);
        list.appendChild(el);
      }
    </script>
  </body>
</html>
