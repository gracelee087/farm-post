<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Farm Post</title>
    <script src="listing.js"></script>
  </head>
  <body>
    <script>
      function status(r) {
        if (r.sent > 0) return `Posted ${r.sent} listing(s) to Telegram.`;
        if (!r.configured) return "Telegram is not set up, so the listing is saved on the phone. Use the Copy button to post it anywhere.";
        if (r.pending > 0) return `No internet right now. ${r.pending} listing(s) saved and will be posted next time you are online.`;
        return "Nothing waiting to be posted.";
      }

      window["ai_edge_gallery_get_result"] = async (data, secret) => {
        try {
          const req = JSON.parse(data || "{}");
          const action = req.action || "create";
          let result, id = "";
          if (action === "create") {
            const record = addRecord(localStorage, makePost(req));
            id = record.id;
            let r;
            try {
              r = await flush(localStorage, fetch, secret, navigator.onLine);
            } catch (e) {
              return JSON.stringify({ result: `Listing saved on the phone, but posting failed: ${e.message}. It will be tried again next time.`,
                                      webview: { url: `card.html?id=${id}` } });
            }
            result = `Listing saved. ${status(r)}`;
          } else if (action === "publish") {
            result = status(await flush(localStorage, fetch, secret, navigator.onLine));
          } else if (action === "list") {
            const records = load(localStorage);
            const waiting = records.filter((x) => x.status === "pending").length;
            result = `${records.length} listing(s) on this phone, ${waiting} waiting to be posted.`;
          } else {
            return JSON.stringify({ error: `Unknown action: ${action}` });
          }
          return JSON.stringify({ result, webview: { url: id ? `card.html?id=${id}` : "card.html", aspectRatio: 0.75 } });
        } catch (e) {
          console.error(e);
          return JSON.stringify({ error: `Farm Post failed: ${e.message}` });
        }
      };
    </script>
  </body>
</html>
