<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Farm Post</title>
    <script src="listing.js"></script>
  </head>
  <body>
    <script>
      function status(r) {
        const done = [];
        if (r.sent > 0) done.push(`posted ${r.sent} listing(s) to Telegram`);
        if (r.edited > 0) done.push(`updated ${r.edited} Telegram post(s)`);
        if (done.length) return done.join(" and ") + ".";
        if (!r.configured) return "Telegram is not set up, so it is saved on the phone. Use the Copy button to post it anywhere.";
        if (r.pending > 0) return `No internet right now. ${r.pending} listing(s) saved and will be posted next time you are online.`;
        return "Nothing waiting to be posted.";
      }

      async function tryFlush(secret) {
        try {
          return status(await flush(localStorage, fetch, secret, navigator.onLine));
        } catch (e) {
          return `Saved on the phone, but posting failed: ${e.message}. It will be tried again next time.`;
        }
      }

      window["ai_edge_gallery_get_result"] = async (data, secret) => {
        try {
          const req = JSON.parse(data || "{}");
          const action = req.action || "create";
          let result, id = "";
          if (action === "create") {
            id = addRecord(localStorage, makePost(req)).id;
            result = `Listing saved. ${await tryFlush(secret)}`;
          } else if (action === "stock") {
            const r = updateStock(localStorage, req);
            id = r.id;
            const left = r.post.stock === 0 ? "now SOLD OUT" : `${r.post.stock} left`;
            result = `"${r.post.title}": ${left}. ${await tryFlush(secret)}`;
          } else if (action === "market") {
            if (!navigator.onLine) return JSON.stringify({ result: "No internet right now. Prices can be checked once you are online." });
            if (!req.query) return JSON.stringify({ error: "No product given to look up." });
            return JSON.stringify({ result: await marketPrice(fetch, req.query, req.country) });
          } else if (action === "publish") {
            result = await tryFlush(secret);
          } else if (action === "list") {
            const records = load(localStorage);
            const lines = records.map((r) => `- ${r.post.title}: ${r.post.price_text || "no price"}, ` +
              `${r.post.stock === null ? "stock unknown" : r.post.stock === 0 ? "SOLD OUT" : r.post.stock + " left"}, ` +
              `${r.status === "published" ? "posted" : "waiting to be posted"}`);
            result = records.length ? `${records.length} listing(s) on this phone:\n${lines.join("\n")}` : "No listings yet.";
          } else {
            return JSON.stringify({ error: `Unknown action: ${action}` });
          }
          return JSON.stringify({ result, webview: { url: id ? `card.html?id=${id}` : "card.html", aspectRatio: 0.75 } });
        } catch (e) {
          console.error(e);
          return JSON.stringify({ error: `Farm Post failed: ${e.message}` });
        }
      };
    </script>
  </body>
</html>
